# ─── greykit.com/games/retrosurfer96/ — validate + deploy ────────────────
#
# Single rsync job over SSH to DreamHost, mirroring the sibling games
# (pumaclicker, hackermap). Auth comes from CI/CD variables inherited from
# the greykit-app GitLab group:
#
#   DREAMHOST_SSH_KEY    File-type CI variable holding the private SSH key
#   DREAMHOST_HOST       DreamHost SSH host
#   DREAMHOST_USERNAME   DreamHost shell user; deploy target is
#                        /home/$DREAMHOST_USERNAME/greykit.com/games/retrosurfer96/
#
# Those three are *protected* variables, so they are only exposed to pipelines
# on protected branches. `main` is protected on this project — if you rename
# the default branch or deploy from another one, protect it too or the deploy
# will run with empty DREAMHOST_* vars and fail at ssh.
#
# The game is retro-surfer.js, one self-contained script that injects its own
# CSS (greykit.com's Konami egg loads it alone). The standalone page around it
# is index.html, title.js and title.css, with the canon boot (gk-title.js) and
# palette (gk-tokens.css) copied from games-meta. No build step; README.md,
# DEVELOPMENT.md and tools/ stay in the repo.
#
# No --delete: this preserves untracked server-side files in the directory
# (.htaccess for cache headers, etc.) that don't live in this repo. The
# greykitweb repo that deploys greykit.com itself runs rsync --delete with
# --exclude='games/', so a website deploy won't wipe this subpath either.

stages:
  - validate
  - deploy

# The game is one file of hand-editable character-grid art, so the likely
# breakage is data-shaped and silent — a short row, a colour with no palette
# entry, a sprite no era can spawn. Catch that before it reaches the site.
validate:
  stage: validate
  image: node:20-alpine
  script:
    - node --check retro-surfer.js
    - node --check gk-title.js
    - node --check title.js
    - node tools/check-sprites.js
    - test -s index.html
    - grep -q 'src="retro-surfer.js?v=' index.html
    - node tools/stamp-assets.js --check
    - grep -q '@gk-title-begin' gk-title.js
    - grep -q '@gk-tokens-begin' gk-tokens.css

deploy:
  stage: deploy
  image: debian:bookworm-slim
  only:
    - main
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync > /dev/null 2>&1
    - mkdir -p ~/.ssh
    - cp "$DREAMHOST_SSH_KEY" ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Host key is PINNED rather than scanned. A bare `ssh-keyscan` opens a burst
    # of parallel connections (one per host-key type), which trips an SSH-scan
    # detector on the self-hosted runner's network path; outbound port 22 to the
    # target is then blackholed for ~3 minutes -- long enough for the rsync below
    # to time out, which is what makes the job die with exit 255 after 133s.
    # Pinning costs zero connections and is also strictly safer than trusting
    # whatever key happens to answer at deploy time.
    # If DreamHost rebuilds the VPS this must be re-pinned: the job will then
    # fail loudly on a host key mismatch rather than silently trust a new key.
    - echo "$DREAMHOST_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEtxw582rJAeTpXMTRJeGJ6GHis19hHmWWBwEL1bCbYd" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # ConnectTimeout turns a blocked port into a 15s failure instead of a 133s
    # one. It lives in ssh_config rather than on each command line so that
    # rsync's own ssh picks it up too, without touching any rsync invocation.
    - printf 'Host *\n  ConnectTimeout 15\n  BatchMode yes\n' > ~/.ssh/config
    - chmod 600 ~/.ssh/config
    # Outbound port 22 to this host gets blackholed for minutes once too many
    # SSH connections go to it in a short window -- a mass deploy trips it even
    # with no ssh-keyscan anywhere. Retry with long gaps so a queued deploy rides
    # the block out instead of going red. The gaps are deliberately long: probing
    # harder re-arms the block rather than clearing it.
    - |
      puma_rsync() {
        attempt=1
        until rsync "$@"; do
          if [ "$attempt" -ge 3 ]; then
            echo "rsync failed after $attempt attempts" >&2
            return 1
          fi
          echo "attempt $attempt failed; waiting 200s for any port-22 block to clear"
          attempt=$((attempt + 1))
          sleep 200
        done
      }
  script:
    # §42 — emit a version.json fingerprint of the deployed bytes.
    - SHA=${CI_COMMIT_SHORT_SHA}
    - BYTES=$(wc -c < retro-surfer.js | tr -d ' ')
    - MD5=$(md5sum retro-surfer.js | awk '{print $1}')
    - printf '{"size":%s,"md5":"%s","commit":"%s"}\n' "$BYTES" "$MD5" "$SHA" > version.json
    # Ensure the subdirectory exists (first deploy creates the leaf), then ship
    # the runtime files. Apache serves index.html for the bare directory,
    # so both /games/retrosurfer96/ and /games/retrosurfer96/index.html resolve.
    # icon.svg / apple-touch-icon.png are referenced from the <head>; this job
    # ships an explicit list, so leaving them out means the links 404 while the
    # pipeline still goes green.
    - puma_rsync --rsync-path="mkdir -p '/home/${DREAMHOST_USERNAME}/greykit.com/games/retrosurfer96/' && rsync" -avz --chmod=F644 index.html retro-surfer.js title.js title.css gk-title.js gk-tokens.css version.json icon.svg apple-touch-icon.png ${DREAMHOST_USERNAME}@${DREAMHOST_HOST}:/home/${DREAMHOST_USERNAME}/greykit.com/games/retrosurfer96/
  environment:
    name: production
    url: https://greykit.com/games/retrosurfer96/
  artifacts:
    paths:
      - index.html
      - retro-surfer.js
      - title.js
      - title.css
      - gk-title.js
      - gk-tokens.css
      - version.json
    expire_in: 30 days
