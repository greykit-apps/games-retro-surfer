<html lang="en">

<body>
<div id="title" class="rs-title" hidden>
  <canvas class="rs-scene" aria-hidden="true"></canvas>
  <div class="rs-shade" aria-hidden="true"></div>
  <main>
    <h1 class="rs-mark" aria-label="Retro Surfer '96"><span data-t="RETRO"><canvas aria-hidden="true"></canvas></span><span data-t="SURFER '96"><canvas aria-hidden="true"></canvas></span></h1>
    <p class="rs-sub">Ride the information superhighway</p>
    <nav class="rs-menu" aria-label="Main menu">
      <button data-act="new" class="dflt"><kbd>N</kbd><span class="lbl">New game</span><span class="meta" id="best"></span></button>
      <div class="util">
        <button data-act="settings"><kbd>S</kbd><span class="lbl">Settings</span></button>
        <button data-act="help"><kbd>?</kbd><span class="lbl">Help</span></button>
        <button data-act="about"><kbd>A</kbd><span class="lbl">About</span></button>
      </div>
      <div class="legend">
        <canvas id="greens" aria-hidden="true"></canvas>
        <p><b>Grab the green ones.</b> Big junk just slows you, and Clippy is right behind.</p>
      </div>
    </nav>
  </main>
  <footer class="rs-foot"><span class="gk-credit">Built by <a href="https://greykit.com/" target="_blank" rel="noopener">greykit.com</a></span></footer>
</div>

<div id="play" hidden>
  <div class="rs-backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="rs-bar">
    <button id="menubtn" title="Back to the title (Esc)"><kbd>Esc</kbd><span>Menu</span></button>

    <button id="snd" aria-label="Sound" aria-pressed="true" title="Sound (M)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="on" d="M11 5.5c1.2 1.4 1.2 3.6 0 5M12.8 3.8c2.1 2.4 2.1 6 0 8.4" stroke="currentColor" stroke-width="1.4" fill="none"/><path class="off" d="M11 5.5l4 5M15 5.5l-4 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <div id="host"></div>
</div>
