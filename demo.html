<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Surfer '96 — demo</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    gap: 18px; padding: 32px 16px;
    background: #05070f; color: #8b8fa8;
    font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
  }
  h1 { color: #54f2ff; font-size: 18px; margin: 0; letter-spacing: 2px; }
  p { margin: 0; max-width: min(48ch, 100%); text-align: center; }
  kbd {
    background: #16224d; color: #e8ecff; border: 1px solid #2b3550;
    border-radius: 3px; padding: 1px 5px; font: inherit;
  }
  a { color: #3ddc4a; }
</style>
</head>
<body>
  <h1>RETRO SURFER '96</h1>
  <p>Click the screen, then <kbd>Enter</kbd> to start.
     <kbd>←</kbd><kbd>→</kbd> lean the board (tap to nudge, hold to carve),
     <kbd>↓</kbd> tuck for speed, <kbd>↑</kbd> brake.</p>

  <div data-retro-surfer data-width="420"></div>

  <p>Or type the Konami code anywhere on this page
     (<kbd>↑</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><kbd>←</kbd><kbd>→</kbd><kbd>B</kbd><kbd>A</kbd>)
     to open it as an overlay.</p>

  <script src="retro-surfer.js"></script>
  <script>RetroSurfer.konami({ width: 440 });</script>
</body>
</html>
